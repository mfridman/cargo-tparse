[package]
name = "cargo-tparse"
version = "0.1.0"
edition = "2024"
description = "Summarize cargo test JSON output in tables"
license = "MIT"
repository = "https://github.com/mfridman/cargo-tparse"
readme = "README.md"
keywords = ["cargo", "test", "summary", "json"]
categories = ["development-tools::testing", "command-line-utilities"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"

[dev-dependencies]
unicode-width = "0.2.3"
